<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IGT Slot Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage-wrap">
        <div id="stage"></div>
      </div>
      <aside id="side">
        <div class="panel">
          <h3>Balance</h3>
          <div class="balance" id="balance">1000</div>
          <div class="win" id="win-text"></div>
        </div>
        <div class="panel">
          <h3>Controls</h3>
          <div class="row">
            <label for="bet-select">Bet</label>
            <select id="bet-select"></select>
          </div>
          <div class="row">
            <label>Speed</label>
            <button
              id="speed-down-btn"
            >
              −
            </button>
            <span
              id="speed-label"
              >Normal</span
            >
            <button id="speed-up-btn">
              +
            </button>
          </div>
          <div class="row">
            <button id="spin-btn">SPIN</button>
          </div>
        </div>
        <div class="panel">
          <h3>Paytable</h3>
          <div id="paytable" class="muted"></div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
