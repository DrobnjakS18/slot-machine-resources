<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IGT Slot Demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: #0b0f17; color: #e6edf3; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      #app { display: grid; grid-template-columns: 1fr 280px; gap: 16px; min-height: 100vh; padding: 16px; }
      #stage-wrap { display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #1a2030 0%, #0b0f17 70%); border-radius: 12px; overflow: hidden; }
      #stage { display: block; }
      #side { display: flex; flex-direction: column; gap: 12px; }
      .panel { background: #131a26; border: 1px solid #25304a; border-radius: 10px; padding: 12px; }
      .panel h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: #9fb0d0; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
      .row label { flex: 0 0 88px; color: #9fb0d0; }
      select, input[type="number"], button { background: #1c2435; color: #e6edf3; border: 1px solid #2c3a55; border-radius: 6px; padding: 6px 10px; font-size: 14px; }
      button { cursor: pointer; }
      button:hover { background: #25304a; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .balance { font-size: 22px; font-weight: 600; color: #ffd166; }
      .win { font-size: 18px; color: #06d6a0; min-height: 22px; }
      .debug-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
      .debug-grid input { width: 100%; padding: 4px; font-size: 12px; }
      details summary { cursor: pointer; color: #9fb0d0; font-size: 13px; }
      .muted { color: #6b7a99; font-size: 12px; }
      @media (max-width: 900px) {
        #app { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage-wrap">
        <div id="stage"></div>
      </div>
      <aside id="side">
        <div class="panel">
          <h3>Balance</h3>
          <div class="balance" id="balance">1000</div>
          <div class="win" id="win-text"></div>
        </div>
        <div class="panel">
          <h3>Controls</h3>
          <div class="row">
            <label for="bet-select">Bet</label>
            <select id="bet-select"></select>
          </div>
          <div class="row">
            <label>Speed</label>
            <button id="speed-down-btn" title="Slow down" aria-label="Slow down">−</button>
            <span id="speed-label" style="flex:1; text-align:center; font-weight:600; color:#ffd166;">Normal</span>
            <button id="speed-up-btn" title="Speed up" aria-label="Speed up">+</button>
          </div>
          <div class="row">
            <button id="spin-btn" style="flex:1; padding: 10px;">SPIN</button>
          </div>
        </div>
        <div class="panel">
          <details>
            <summary>Debug panel</summary>
            <div class="row"><label><input type="checkbox" id="debug-toggle" /> Force next spin</label></div>
            <div class="muted">Set a stop index per reel (0..reelLength-1). Leave blank for RNG.</div>
            <div class="debug-grid" id="debug-stops"></div>
          </details>
        </div>
        <div class="panel">
          <h3>Paytable</h3>
          <div id="paytable" class="muted"></div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
