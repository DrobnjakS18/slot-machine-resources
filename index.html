<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IGT Slot Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage-wrap">
        <div id="stage"></div>
      </div>
      <aside id="side">
        <div class="panel panel--balance">
          <h3>Balance</h3>
          <div class="balance-box">
            <span class="balance" id="balance">1000</span>
          </div>
          <div class="win" id="win-text"></div>
          <div class="last-win" id="last-win"></div>
        </div>
        <div class="panel">
          <div class="controls-top">
            <div class="control-group">
              <label class="ctrl-label">Bet</label>
              <div class="bet-control">
                <button id="bet-down-btn">−</button>
                <button id="bet-label-btn" class="bet-label-btn">
                  <!-- <span class="bet-ctrl-sub">BET</span> -->
                  <span id="bet-label">1</span>
                </button>
                <button id="bet-up-btn">+</button>
              </div>
            </div>
            <div class="control-group">
              <label class="ctrl-label">Speed</label>
              <div class="speed-control">
                <button id="speed-down-btn">−</button>
                <span id="speed-label">Normal</span>
                <button id="speed-up-btn">+</button>
              </div>
            </div>
          </div>
          <button id="spin-btn">SPIN</button>
        </div>
        <div class="panel">
          <h3>Paytable</h3>
          <div id="paytable" class="muted"></div>
        </div>
      </aside>
    </div>
    <div id="bet-popup-overlay" class="bet-popup-overlay">
      <div class="bet-popup">
        <div class="bet-popup-header">
          <span>BET</span>
          <button id="bet-popup-close">×</button>
        </div>
        <div id="bet-popup-grid" class="bet-popup-grid"></div>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
